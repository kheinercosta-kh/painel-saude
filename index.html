<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Painel de Saúde</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saúde">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#E7EBEE; --papel:#FCFDFD; --tinta:#16202B; --fraco:#6C7A88;
  --linha:#D3DAE0; --teal:#1F6F68; --tealclaro:#D4E5E3; --areia:#B98B2E;
  --barro:#A2453A; --barroclaro:#F6E7E4; --barroclaro:#F6E7E4; --azul:#4C7BA6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font:400 15px/1.5 'IBM Plex Sans',system-ui,sans-serif;
  padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:880px;margin:0 auto}
h1{font:700 30px/1 'IBM Plex Sans Condensed',sans-serif;margin:0;letter-spacing:-.01em}
.sobre{font:500 11px 'IBM Plex Mono',monospace;color:var(--fraco);
  letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  padding:20px;margin-bottom:14px}
.cartao.destaque{border-left:3px solid var(--teal)}
.cartao.crise{border-left:3px solid var(--barro)}
.et{font:500 11px 'IBM Plex Mono',monospace;color:var(--fraco);
  letter-spacing:.14em;text-transform:uppercase}
.etf{font:400 12px 'IBM Plex Mono',monospace;color:var(--fraco)}
.topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rot{font:400 13px 'IBM Plex Sans';color:var(--fraco);display:block}
input,textarea,select,button{font-family:'IBM Plex Sans',sans-serif}
input,textarea,select{width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--linha);background:#fff;color:var(--tinta);font-size:15px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.suf{font:400 13px 'IBM Plex Mono',monospace;color:var(--fraco);flex-shrink:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.linha-in{display:flex;align-items:center;gap:6px;margin-top:6px}
/* abas */
nav.abas{display:flex;gap:4;align-items:center;border-bottom:1px solid var(--linha);
  margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{background:none;border:none;border-bottom:2px solid transparent;
  padding:8px 12px;cursor:pointer;color:var(--fraco);font:500 13px 'IBM Plex Sans';white-space:nowrap}
nav.abas button.on{color:var(--tinta);border-bottom-color:var(--teal)}
#estado{margin-left:auto;font:400 11px 'IBM Plex Mono',monospace;color:var(--fraco);
  letter-spacing:.06em;padding-bottom:8px;white-space:nowrap}
/* instrumento */
.num{font:600 44px/1 'IBM Plex Mono',monospace;letter-spacing:-.02em}
.trilho{position:relative;height:34px;border-radius:6px;overflow:hidden;background:#EEF1F3}
.zona{position:absolute;top:0;bottom:0}
.marca{position:absolute;top:0;bottom:0;width:2px}
.agulha{position:absolute;top:-3px;bottom:-3px;width:4px;border-radius:2px;
  box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.legs{position:relative;height:18px;margin-top:6px}
.legs span{position:absolute;transform:translateX(-50%);white-space:nowrap;
  font:400 10px 'IBM Plex Mono',monospace}
.prot{height:8px;border-radius:4px;background:#EEF1F3;overflow:hidden;margin-top:10px}
.prot>div{height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.alerta{background:var(--barroclaro);border:1px solid #E4C6C0;border-radius:12px;
  padding:14px 18px;margin-bottom:14px;font:400 13px/1.5 'IBM Plex Sans';color:var(--barro)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--linha);cursor:pointer;
  font:500 13px 'IBM Plex Sans';background:transparent;color:var(--tinta);transition:all .15s}
.divisor{margin-top:18px;padding-top:16px;border-top:1px solid var(--linha)}
.resumo-dia{margin-top:16px;padding:10px 14px;border-radius:8px;background:var(--tealclaro);
  font:500 13px 'IBM Plex Sans';color:var(--teal)}
/* checklist */
ul.lst{list-style:none;padding:0;margin:12px 0 0}
ul.lst button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:none;padding:7px 0;cursor:pointer}
.cx{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--linha);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.selo{margin-left:auto;font:500 10px 'IBM Plex Mono',monospace;color:var(--barro);
  letter-spacing:.08em;text-transform:uppercase}
/* resumo / cards */
.rcard{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:16px}
.rval{font:600 26px/1.1 'IBM Plex Mono',monospace;margin:8px 0 4px}
.nota{font:400 12px 'IBM Plex Sans';color:var(--fraco);margin:6px 0 0}
/* treino */
.serie{background:#F5F7F8;border:1px solid var(--linha);border-radius:8px;padding:10px}
.gser{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.snum{font:500 10px 'IBM Plex Mono',monospace;color:var(--fraco);letter-spacing:.1em;
  display:block;margin-bottom:7px}
.ultc{font:500 12px 'IBM Plex Mono',monospace;color:var(--teal);background:var(--tealclaro);
  border-radius:5px;padding:3px 9px;white-space:nowrap}
.dropsel{background:#F2E6CF;color:var(--areia);border-radius:4px;padding:2px 7px;
  font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
/* botões */
.btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px 20px;
  cursor:pointer;font:500 14px 'IBM Plex Sans'}
.btn2{background:transparent;color:var(--fraco);border:1px solid var(--linha);border-radius:8px;
  padding:11px 20px;cursor:pointer;font:500 14px 'IBM Plex Sans'}
.btnlink{background:none;border:none;color:var(--fraco);cursor:pointer;
  font:400 12px 'IBM Plex Sans';text-decoration:underline;padding:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:#EEF1F3;border-radius:5px;padding:3px 9px;
  font:400 11px 'IBM Plex Mono',monospace;color:var(--fraco)}
.pont{font:600 20px 'IBM Plex Mono',monospace;color:var(--barro);line-height:1}
.gatilho{font:400 13px/1.5 'IBM Plex Sans';padding-left:14px;
  border-left:2px solid var(--linha);margin-bottom:10px}
.vazio{font:400 13px/1.6 'IBM Plex Sans';color:var(--fraco);text-align:center;
  padding:28px 20px;background:var(--papel);border-radius:12px;border:1px dashed var(--linha)}
footer{max-width:880px;margin:28px auto 0;font:400 11px/1.6 'IBM Plex Sans';
  color:var(--fraco);text-align:center}
/* login */
.login{max-width:380px;margin:8vh auto;background:var(--papel);border:1px solid var(--linha);
  border-radius:12px;padding:28px}
.login input{margin-top:6px;margin-bottom:14px}
.erro{color:var(--barro);font:400 13px 'IBM Plex Sans';margin-top:10px}
svg.chart{width:100%;height:210px;display:block;margin-top:10px}
svg text{font:400 10px 'IBM Plex Mono',monospace;fill:var(--fraco)}
.metalinha{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--linha)}
.metalinha input{width:88px;text-align:right}
.dia{border:none;padding:0;cursor:pointer;aspect-ratio:1;border-radius:6px;
  display:flex;align-items:center;justify-content:center}
.dia:hover{transform:scale(1.14)}
.dia:focus-visible{outline:2px solid #fff;outline-offset:2px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.legenda span{display:flex;align-items:center;gap:6px;font:400 11px 'IBM Plex Sans';color:#8FA0AE}
.pt{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0}
#detalheDia{margin-top:14px;padding:12px 14px;border-radius:8px;background:#20303E;
  font:400 13px/1.5 'IBM Plex Sans';color:#C6D2DB}
.faixaRef{position:relative;height:24px;border-radius:5px;background:#EEF1F3;
  overflow:hidden;margin-top:6px}
.faixaRef .ok{position:absolute;top:0;bottom:0;background:var(--tealclaro)}
.faixaRef .mk{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px}
.tile{border:1px solid var(--linha);border-radius:10px;padding:14px}
.gradeDois{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
svg text{font-family:'IBM Plex Mono',monospace}
@media (prefers-reduced-motion:no-preference){
  .anim{transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
  .dia{transition:transform .12s}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<footer>Registro pessoal. Não substitui avaliação médica.</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://bxmavxwulyzayzwrlgwm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9LbETG1jHtvye6Tg_m4_tw_dNHX-LCy';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= CONSTANTES ================= */
const SESSOES = [
  ['forcaA','Força A','#1F6F68'], ['zona2','Zona 2','#4C7BA6'],
  ['forcaB','Força B','#1F6F68'], ['forcaC','Força C','#1F6F68'],
  ['caminhada','Caminhada','#7C8B99'], ['corrida','Corrida','#4C7BA6'],
  ['descanso','Descanso','#B6BEC6'],
];
const GRUPOS = [
  ['superiores','Superiores','#1F6F68'], ['core','Core','#8A6A2F'],
  ['inferiores','Inferiores','#4C7BA6'], ['alongamento','Alongamento','#7C8B99'],
];
const CHECKS = [
  ['comeuAntes','Comi antes do remédio',1],
  ['sem5h','Nenhum intervalo > 5h sem comer',1],
  ['cafeina14','Cafeína encerrada até 14h',0],
  ['respManha','Respiração 5 min — manhã',0],
  ['respNoite','Respiração 5 min — noite',0],
  ['cama','Na cama até 22:30',0],
];
const EXERCICIOS = {
  forcaA:{nome:'Força A — corpo inteiro',lista:[
    ['a1','Agachamento ou leg press','8–12',0,0],
    ['a2','Supino ou flexão','8–12',0,0],
    ['a3','Remada','8–12',0,0],
    ['a4','Elevação lateral','10–12',0,0],
    ['a5','Prancha','30–45 s',1,1]]},
  forcaB:{nome:'Força B — corpo inteiro',lista:[
    ['b1','Levantamento terra romeno','8–12',0,0],
    ['b2','Desenvolvimento','8–12',0,0],
    ['b3','Puxada','8–12',0,0],
    ['b4','Afundo','10 por perna',0,0],
    ['b5','Abdominal','12–15',1,1]]},
  forcaC:{nome:'Força C — opcional, recomposição',lista:[
    ['c1','Leg press ou cadeira extensora','10–12',0,0],
    ['c2','Supino inclinado','8–12',0,0],
    ['c3','Remada unilateral','10 por lado',0,0],
    ['c4','Rosca direta','10–12',0,0],
    ['c5','Tríceps corda','10–12',0,1]]},
};
const CARDIO = {
  zona2:['Zona 2 — 35 a 45 min',[
    'Faixa alvo: 120 a 135 bpm.',
    'Teste da fala: frases completas sim, cantar não.',
    'Passou de 140, diminua o ritmo. Caminhe se precisar.',
    'Aquecimento de 5 a 10 min e desaquecimento de 5 min, sempre.']],
  corrida:['Corrida — 5 a 6 km confortável',[
    'Ritmo em que você ainda consegue conversar.',
    'Nunca em jejum. Carbo mais proteína 60 a 90 min antes.',
    'Nunca parar de repente: 5 min caminhando ao final.',
    'Se a sensação de crise começar, reduza para caminhada — não pare.']],
  caminhada:['Caminhada longa e mobilidade — 40 a 50 min',[
    'Intensidade muito baixa. Esta sessão é recuperação.',
    '10 min de mobilidade ao final: quadril, torácica, tornozelo.']],
  descanso:['Descanso',['Descanso também é parte do plano. Não compense treinando.']],
};
const AGENDA = ['descanso','forcaA','zona2','forcaB','caminhada','corrida','caminhada'];
const METAS_PADRAO = {piso_kcal:1900,kcal_alvo:2150,gasto_kcal:2697,proteina_g:183,
  agua_l:2.75,cafeina_max_ml:450,peso_base:90.8,fc_base:57,sono_alvo_min:435,
  inicio_plano:'2026-08-26'};

/* ================= UTIL ================= */
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hojeIso = () => iso(new Date());
const somaDias = (s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diaPlano = (s,ini)=>Math.floor((new Date(s+'T00:00:00')-new Date(ini+'T00:00:00'))/864e5)+1;
const DIAS_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function rotuloData(s){const d=new Date(s+'T00:00:00');
  return `${DIAS_SEM[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
const hm = m => m ? `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}` : '—';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = id => document.getElementById(id);

/* ================= ESTADO ================= */
const S = {
  user:null, aba:'painel', data:hojeIso(),
  registros:{},         // data -> registro
  cargas:{},            // data -> {exId: {serie: {carga_kg,reps}}}
  cargasMax:{},         // exId -> maior carga anterior
  crises:[], metas:{...METAS_PADRAO},
  vendo:null, salvando:false, msg:'',
};

/* ================= PERSISTÊNCIA ================= */
let fila = {}, timer = null;

function marcar(tipo, dados){
  fila[tipo] = {...(fila[tipo]||{}), ...dados};
  S.salvando = true; pintarEstado();
  clearTimeout(timer);
  timer = setTimeout(descarregar, 700);
}

async function descarregar(){
  const f = fila; fila = {};
  const chaves = Object.keys(f);
  if(!chaves.length){ S.salvando=false; pintarEstado(); return; }
  try{
    if(f.registro){
      const r = {...S.registros[S.data], data:S.data, ...f.registro};
      delete r.id; delete r.user_id; delete r.criado_em; delete r.atualizado_em;
      const {error} = await sb.from('sd_registros_diarios')
        .upsert(r,{onConflict:'user_id,data'});
      if(error) throw error;
    }
    if(f.metas){
      const {error} = await sb.from('sd_metas')
        .upsert({...S.metas, user_id:S.user.id},{onConflict:'user_id'});
      if(error) throw error;
    }
    if(f.cargas){
      const linhas = Object.values(f.cargas);
      if(linhas.length){
        const {error} = await sb.from('sd_cargas_treino')
          .upsert(linhas,{onConflict:'user_id,data,exercicio_id,serie'});
        if(error) throw error;
      }
    }
    S.msg=''; S.salvando=false;
  }catch(e){
    fila = {...f, ...fila};
    S.msg = 'Falha ao salvar: ' + (e.message||e);
    S.salvando=false;
  }
  pintarEstado();
}
addEventListener('pagehide', ()=>{clearTimeout(timer); descarregar()});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){clearTimeout(timer); descarregar()}
});


/* ================= CARGA INICIAL ================= */
async function carregarTudo(){
  const ini = S.metas.inicio_plano;
  const fim = somaDias(ini, 40);
  const [rd, ct, cr, mt] = await Promise.all([
    sb.from('sd_registros_diarios').select('*').gte('data',ini).lte('data',fim),
    sb.from('sd_cargas_treino').select('*'),
    sb.from('sd_crises').select('*').order('data',{ascending:false}),
    sb.from('sd_metas').select('*').maybeSingle(),
  ]);
  if(mt.data) S.metas = {...METAS_PADRAO, ...mt.data};
  else await sb.from('sd_metas').upsert({user_id:S.user.id, ...METAS_PADRAO});

  S.registros = {};
  (rd.data||[]).forEach(r => S.registros[r.data] = r);

  S.cargas = {}; S.cargasMax = {};
  (ct.data||[]).forEach(c=>{
    (S.cargas[c.data] ||= {});
    (S.cargas[c.data][c.exercicio_id] ||= {});
    S.cargas[c.data][c.exercicio_id][c.serie] = c;
  });
  S.crises = cr.data||[];
  recalcularMax();
}

function recalcularMax(){
  S.cargasMax = {};
  Object.entries(S.cargas).forEach(([data,exs])=>{
    if(data >= S.data) return;
    Object.entries(exs).forEach(([ex,series])=>{
      Object.values(series).forEach(s=>{
        if(s.carga_kg!=null && (!S.cargasMax[ex] || s.carga_kg > S.cargasMax[ex]))
          S.cargasMax[ex] = Number(s.carga_kg);
      });
    });
  });
}

/* ================= HELPERS DE REGISTRO ================= */
function reg(){ return S.registros[S.data] || {data:S.data, sessoes:[], grupos:[], checklist:{}} }
function setCampo(campo, valor){
  const r = reg();
  const v = valor === '' ? null : valor;
  S.registros[S.data] = {...r, [campo]:v};
  marcar('registro', {[campo]:v});
}
function alternarLista(campo, valor){
  const r = reg(); const atual = r[campo]||[];
  const nova = atual.includes(valor) ? atual.filter(x=>x!==valor) : [...atual, valor];
  S.registros[S.data] = {...r, [campo]:nova};
  marcar('registro', {[campo]:nova});
  render();
}
function alternarCheck(id){
  const r = reg(); const c = {...(r.checklist||{})}; c[id] = !c[id];
  S.registros[S.data] = {...r, checklist:c};
  marcar('registro', {checklist:c});
  render();
}

/* ================= RENDER ================= */
function pintarEstado(){
  const e = el('estado');
  if(e) e.textContent = S.msg ? '⚠ erro' : (S.salvando ? 'salvando…' : 'salvo');
  const m = el('msgerro');
  if(m) m.textContent = S.msg;
}

function render(){
  if(!S.user){ renderLogin(); return; }
  const n = diaPlano(S.data, S.metas.inicio_plano);
  el('app').innerHTML = `
    <header style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
      justify-content:space-between;margin-bottom:18px">
      <div>
        <p class="sobre">Plano de 30 dias · ansiedade, sono e corpo</p>
        <h1>Dia <span style="color:var(--teal)">${n>=1&&n<=30?n:'—'}</span>
          <span style="color:var(--fraco);font-weight:400">de 30</span></h1>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="btn2" style="padding:6px 12px" data-nav="-1">‹</button>
        <div style="text-align:center;min-width:130px">
          <p style="font:500 13px 'IBM Plex Mono';margin:0">${rotuloData(S.data)}</p>
          ${S.data!==hojeIso()?'<button class="btnlink" data-hoje="1">voltar para hoje</button>':''}
        </div>
        <button class="btn2" style="padding:6px 12px" data-nav="1">›</button>
      </div>
    </header>
    <div id="msgerro" class="erro"></div>
    <nav class="abas">
      ${[['painel','Painel'],['hoje','Hoje'],['treino','Treino'],['evolucao','Evolução'],
         ['crises','Crises'],['metas','Metas']]
        .map(([k,r])=>`<button data-aba="${k}" class="${S.aba===k?'on':''}">${r}${
          k==='crises'&&S.crises.length?` <span class="tag">${S.crises.length}</span>`:''}</button>`).join('')}
      <span id="estado"></span>
    </nav>
    <div id="conteudo"></div>`;

  el('conteudo').innerHTML =
    S.aba==='painel' ? viewPainel() :
    S.aba==='hoje' ? viewHoje() :
    S.aba==='treino' ? viewTreino() :
    S.aba==='evolucao' ? viewEvolucao() :
    S.aba==='crises' ? viewCrises() : viewMetas();

  ligarEventos(); pintarEstado();
}

function media(arr){ const v=arr.filter(x=>x!=null&&!isNaN(x));
  return v.length ? v.reduce((a,b)=>a+Number(b),0)/v.length : null }
const pctd = (a,b)=> b ? Math.round(a/b*100) : 0;

/* --- gráficos em SVG --- */
function svgDonut(p,cor,{r=48,w=12,txt,sub,size=124}={}){
  const c=2*Math.PI*r, cx=size/2;
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EEF1F3" stroke-width="${w}"/>
    <circle class="anim" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${cor}" stroke-width="${w}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(p,100)/100)}"
      transform="rotate(-90 ${cx} ${cx})"/>
    <text x="${cx}" y="${cx+2}" text-anchor="middle" style="font-size:23px;font-weight:600;fill:${C.tinta}">${txt??p+'%'}</text>
    ${sub?`<text x="${cx}" y="${cx+18}" text-anchor="middle" style="font-size:9px;fill:${C.fraco};letter-spacing:.1em">${sub}</text>`:''}
  </svg>`;
}
function svgPizza(segs,size=150){
  const tot=segs.reduce((s,x)=>s+x[1],0);
  if(!tot) return '';
  const r=size/2-3, cx=size/2; let a=-Math.PI/2, o='';
  segs.forEach(([,v,cor])=>{
    if(!v) return;
    const a2=a+2*Math.PI*v/tot;
    const p1=[cx+r*Math.cos(a),cx+r*Math.sin(a)], p2=[cx+r*Math.cos(a2),cx+r*Math.sin(a2)];
    o+=`<path d="M${cx} ${cx} L${p1} A${r} ${r} 0 ${a2-a>Math.PI?1:0} 1 ${p2} Z"
      fill="${cor}" stroke="${C.papel}" stroke-width="2"/>`;
    const am=(a+a2)/2;
    if(v/tot>0.08) o+=`<text x="${cx+r*0.6*Math.cos(am)}" y="${cx+r*0.6*Math.sin(am)+4}"
      text-anchor="middle" style="font-size:13px;font-weight:600;fill:#fff">${Math.round(v/tot*100)}%</text>`;
    a=a2;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">${o}</svg>`;
}
function svgRadar(vals,size=220){
  const cx=size/2, r=size/2-36, n=vals.length;
  const pt=(i,f)=>{const a=-Math.PI/2+2*Math.PI*i/n; return [cx+r*f*Math.cos(a), cx+r*f*Math.sin(a)]};
  let g=''; [0.25,0.5,0.75,1].forEach(f=>
    g+=`<polygon points="${vals.map((_,i)=>pt(i,f)).join(' ')}" fill="none" stroke="${C.linha}"/>`);
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">${g}
    <polygon points="${vals.map((v,i)=>pt(i,Math.min(v[1],100)/100)).join(' ')}"
      fill="rgba(31,111,104,.18)" stroke="${C.teal}" stroke-width="2"/>
    ${vals.map((v,i)=>{const q=pt(i,Math.min(v[1],100)/100);
      return `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${C.teal}"/>`}).join('')}
    ${vals.map((v,i)=>{const q=pt(i,1.24);
      return `<text x="${q[0]}" y="${q[1]+3}" text-anchor="middle"
        style="font-size:9px;fill:${C.fraco};letter-spacing:.05em">${v[0].toUpperCase()}</text>`}).join('')}</svg>`;
}
function svgSpark(v,cor,w=200,h=40){
  if(v.length<2) return `<p class="etf" style="margin:8px 0 0">dados insuficientes</p>`;
  const mn=Math.min(...v), mx=Math.max(...v);
  const x=i=>i/(v.length-1)*w, y=n=>h-2-(n-mn)/((mx-mn)||1)*(h-6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px">
    <polyline points="${v.map((n,i)=>`${x(i)},${y(n)}`).join(' ')}" fill="none"
      stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(v.length-1)}" cy="${y(v.at(-1))}" r="3" fill="${cor}"/></svg>`;
}

/* ---------- EVOLUÇÃO ---------- */
function serie(){
  const out=[]; const ini=S.metas.inicio_plano;
  for(let i=0;i<30;i++){
    const d=somaDias(ini,i), r=S.registros[d];
    out.push({i:i+1,data:d,
      rot:d.slice(8,10)+'/'+d.slice(5,7),
      peso:r?.peso_kg??null, sono:r?.sono_min??null, fc:r?.fc_repouso??null,
      kcal:r?.kcal??null,
      treinou:(r?.sessoes?.some(s=>s!=='descanso')||r?.grupos?.length)?1:0});
  }
  return out;
}

function grafLinha(dados,chave,cor,dominio,ref,fmt){
  const W=680,H=200,P={t:12,r:12,b:24,l:38};
  const vals=dados.map(d=>d[chave]).filter(v=>v!=null);
  if(vals.length<1) return `<p class="vazio">Sem dados ainda.</p>`;
  const [min,max]=dominio||[Math.min(...vals)-1,Math.max(...vals)+1];
  const x=i=>P.l+(W-P.l-P.r)*i/29;
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-min)/(max-min||1));
  let dstr='',prev=false;
  dados.forEach((d,i)=>{ if(d[chave]==null){prev=false;return}
    dstr += (prev?'L':'M')+x(i)+' '+y(d[chave])+' '; prev=true; });
  const ticks=[min,(min+max)/2,max];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}"
      stroke="var(--linha)" stroke-dasharray="2 4"/>
      <text x="4" y="${y(t)+3}">${fmt?fmt(t):Math.round(t)}</text>`).join('')}
    ${ref!=null?`<line x1="${P.l}" x2="${W-P.r}" y1="${y(ref)}" y2="${y(ref)}"
      stroke="var(--fraco)" stroke-dasharray="4 4"/>`:''}
    <path d="${dstr}" fill="none" stroke="${cor}" stroke-width="2.5"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dados.map((d,i)=>d[chave]!=null?`<circle cx="${x(i)}" cy="${y(d[chave])}" r="3" fill="${cor}"/>`:'').join('')}
    ${dados.filter((_,i)=>i%5===0).map((d,j)=>`<text x="${x(j*5)}" y="${H-6}" text-anchor="middle">${d.rot}</text>`).join('')}
  </svg>`;
}

function grafBarras(dados,chave,cor,max,refs){
  const W=680,H=200,P={t:12,r:12,b:24,l:38};
  const x=i=>P.l+(W-P.l-P.r)*i/dados.length;
  const bw=(W-P.l-P.r)/dados.length*0.6;
  const y=v=>P.t+(H-P.t-P.b)*(1-v/max);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${[0,max/2,max].map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}"
      stroke="var(--linha)" stroke-dasharray="2 4"/><text x="4" y="${y(t)+3}">${Math.round(t)}</text>`).join('')}
    ${(refs||[]).map(([v,c,d])=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}"
      stroke="${c}" stroke-width="1.5" ${d?'stroke-dasharray="4 4"':''}/>`).join('')}
    ${dados.map((d,i)=>d[chave]?`<rect x="${x(i)}" y="${y(d[chave])}" width="${bw}"
      height="${H-P.b-y(d[chave])}" fill="${cor}" rx="2"/>`:'').join('')}
    ${dados.filter((_,i)=>i%5===0).map((d,j)=>`<text x="${x(j*5)+bw/2}" y="${H-6}" text-anchor="middle">${d.rot||d.sem}</text>`).join('')}
  </svg>`;
}

function ligarEventos(){
  document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{S.aba=b.dataset.aba;render()});
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    S.data=somaDias(S.data,+b.dataset.nav); recalcularMax(); render()});
  const h=document.querySelector('[data-hoje]'); if(h) h.onclick=()=>{S.data=hojeIso();recalcularMax();render()};

  document.querySelectorAll('[data-campo]').forEach(i=>i.oninput=()=>{
    const v=i.type==='number'?(i.value===''?'':Number(i.value)):i.value;
    setCampo(i.dataset.campo, v);
    if(['kcal','proteina_g','kcal_gasto'].includes(i.dataset.campo)) atualizarInstrumento();
  });
  document.querySelectorAll('[data-lista]').forEach(b=>b.onclick=()=>alternarLista(b.dataset.lista,b.dataset.val));
  document.querySelectorAll('[data-relacao]').forEach(b=>b.onclick=()=>{
    const v = b.dataset.relacao==='sim';
    setCampo('houve_relacao', reg().houve_relacao===v ? null : v); render();
  });
  document.querySelectorAll('[data-ejac]').forEach(b=>b.onclick=()=>{
    setCampo('ejaculacao', reg().ejaculacao===b.dataset.ejac ? null : b.dataset.ejac); render();
  });
  document.querySelectorAll('[data-ansdur]').forEach(b=>b.onclick=()=>{
    setCampo('ansiedade_durante', !reg().ansiedade_durante); render();
  });
  const lb=el('libido');
  if(lb) lb.oninput=()=>{ setCampo('libido', Number(lb.value));
    lb.previousElementSibling.querySelector('span:last-child').textContent = lb.value+' / 10'; };
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>alternarCheck(b.dataset.check));
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{S.vendo=b.dataset.ver;render()});

  const sh=el('sonoH'), sm=el('sonoM');
  if(sh&&sm){ const upd=()=>{
    const t=(Number(sh.value)||0)*60+(Number(sm.value)||0);
    setCampo('sono_min', t||''); }; sh.oninput=upd; sm.oninput=upd; }

  document.querySelectorAll('[data-ex]').forEach(i=>i.oninput=()=>{
    const {ex,nome,serie:s,tipo}=i.dataset;
    (S.cargas[S.data]||={}); (S.cargas[S.data][ex]||={});
    const atual = S.cargas[S.data][ex][s] || {};
    const linha = {...atual, user_id:S.user.id, data:S.data, sessao:S.vendo,
      exercicio_id:ex, exercicio_nome:nome, serie:Number(s),
      [tipo]: i.value===''?null:Number(i.value)};
    S.cargas[S.data][ex][s]=linha;
    marcar('cargas', {[`${ex}-${s}`]:linha});
  });

  document.querySelectorAll('[data-meta]').forEach(i=>i.oninput=()=>{
    S.metas[i.dataset.meta] = i.type==='number'?Number(i.value):i.value;
    marcar('metas',{});
  });

  const ri=el('c_intensidade');
  if(ri) ri.oninput=()=>el('c_int_lbl').textContent=ri.value+' / 10';
  const sc=el('salvarCrise'); if(sc) sc.onclick=salvarCrise;
  document.querySelectorAll('[data-delcrise]').forEach(b=>b.onclick=async()=>{
    await sb.from('sd_crises').delete().eq('id',b.dataset.delcrise);
    S.crises=S.crises.filter(c=>c.id!==b.dataset.delcrise); render();
  });
  const det=el('detalheDia');
  if(det) document.querySelectorAll('.dia').forEach(b=>b.onclick=()=>{
    const d=b.dataset.dia, rg=S.registros[d];
    const nCr=S.crises.filter(c=>c.data===d).length;
    if(!rg){ det.innerHTML=`<span style="color:#8FA0AE">${rotuloData(d)} · sem lançamento.</span>`;
      return; }
    const partes=[];
    if(rg.kcal!=null) partes.push(rg.kcal+' kcal');
    if(rg.proteina_g!=null) partes.push(rg.proteina_g+' g proteína');
    if(rg.sono_min!=null) partes.push(hm(rg.sono_min)+' de sono');
    if(rg.fc_repouso!=null) partes.push('FC '+rg.fc_repouso);
    if(rg.peso_kg!=null) partes.push(rg.peso_kg+' kg');
    const ses=(rg.sessoes||[]).map(x=>SESSOES.find(y=>y[0]===x)?.[1]).filter(Boolean);
    if(ses.length) partes.push(ses.join(' + '));
    det.innerHTML=`<strong style="color:#fff">${rotuloData(d)}</strong>`
      + (partes.length?' · '+partes.join(' · '):' · sem números')
      + (nCr?` · <span style="color:#E4938A">${nCr} crise${nCr>1?'s':''}</span>`:'');
  });
  const s=el('sair'); if(s) s.onclick=async()=>{await sb.auth.signOut(); location.reload()};
}

function atualizarInstrumento(){
  // redesenha só o cartão de energia para não perder o foco do input
  const alvo = document.querySelector('.cartao.destaque');
  if(S.aba!=='hoje'||!alvo) return;
  const tmp=document.createElement('div'); tmp.innerHTML=viewHoje();
  const novo=tmp.querySelector('.cartao.destaque');
  const foco=document.activeElement?.dataset?.campo;
  if(foco){ // preserva o input em edição
    novo.querySelectorAll('[data-campo]').forEach(i=>{
      if(i.dataset.campo===foco) i.value=document.activeElement.value;
    });
  }
  alvo.querySelector('.num').textContent = novo.querySelector('.num').textContent;
  const t1=alvo.querySelector('.trilho'), t2=novo.querySelector('.trilho');
  if(t1&&t2) t1.innerHTML=t2.innerHTML;
  const p1=alvo.querySelector('.prot>div'), p2=novo.querySelector('.prot>div');
  if(p1&&p2) p1.style.width=p2.style.width;
  const l1=alvo.querySelector('.legs'), l2=novo.querySelector('.legs');
  if(l1&&l2) l1.innerHTML=l2.innerHTML;
}

async function salvarCrise(){
  const g=id=>el(id).value;
  const linha={
    data:g('c_data')||S.data,
    hora:g('c_hora')||null,
    duracao_min:g('c_duracao')?Number(g('c_duracao')):null,
    intensidade:Number(g('c_intensidade')),
    contexto:g('c_contexto')||null,
    horas_ultima_refeicao:g('c_refeicao')?Number(g('c_refeicao')):null,
    sono_anterior_min:g('c_sono')?Number(g('c_sono')):null,
    cafeina_ml:g('c_cafeina')?Number(g('c_cafeina')):null,
    treinou:g('c_treinou')||null,
    sintomas:g('c_sintomas')||null,
    o_que_ajudou:g('c_ajudou')||null,
  };
  const {data,error}=await sb.from('sd_crises').insert(linha).select().single();
  if(error){ S.msg='Erro ao salvar crise: '+error.message; pintarEstado(); return; }
  S.crises=[data,...S.crises]; render();
}

/* ================= LOGIN ================= */
function renderLogin(msg){
  el('app').innerHTML=`<div class="login">
    <p class="sobre">Painel de saúde</p>
    <h1 style="margin-bottom:20px">Entrar</h1>
    <span class="rot">E-mail</span><input type="email" id="email" autocomplete="username">
    <span class="rot">Senha</span><input type="password" id="senha" autocomplete="current-password">
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn" id="entrar">Entrar</button>
      <button class="btn2" id="criar">Criar conta</button>
    </div>
    <p class="erro">${msg?esc(msg):''}</p>
  </div>`;
  el('entrar').onclick=()=>auth('entrar');
  el('criar').onclick=()=>auth('criar');
  el('senha').onkeydown=e=>{if(e.key==='Enter')auth('entrar')};
}

async function auth(modo){
  const email=el('email').value.trim(), password=el('senha').value;
  if(!email||!password) return renderLogin('Preencha e-mail e senha.');
  const {data,error} = modo==='criar'
    ? await sb.auth.signUp({email,password})
    : await sb.auth.signInWithPassword({email,password});
  if(error) return renderLogin(error.message);
  if(!data.session) return renderLogin('Conta criada. Confirme o e-mail e depois entre.');
  iniciar(data.session.user);
}

async function iniciar(user){
  S.user=user;
  el('app').innerHTML='<p class="vazio">Carregando registros…</p>';
  try{ await carregarTudo(); }
  catch(e){ S.msg='Erro ao carregar: '+(e.message||e); }
  render();
}

/* ================= BOOT ================= */
const {data:{session}} = await sb.auth.getSession();
if(session) iniciar(session.user); else renderLogin();
</script>
