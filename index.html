<style>
:root{
  --fundo:#E7EBEE; --papel:#FCFDFD; --tinta:#16202B; --fraco:#6C7A88;
  --linha:#D3DAE0; --teal:#1F6F68; --tealclaro:#D4E5E3; --areia:#B98B2E;
  --barro:#A2453A; --barroclaro:#F6E7E4; --barroclaro:#F6E7E4; --azul:#4C7BA6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font:400 15px/1.5 'IBM Plex Sans',system-ui,sans-serif;
  padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:880px;margin:0 auto}
h1{font:700 30px/1 'IBM Plex Sans Condensed',sans-serif;margin:0;letter-spacing:-.01em}
.sobre{font:500 11px 'IBM Plex Mono',monospace;color:var(--fraco);
  letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  padding:20px;margin-bottom:14px}
.cartao.destaque{border-left:3px solid var(--teal)}
.cartao.crise{border-left:3px solid var(--barro)}
.et{font:500 11px 'IBM Plex Mono',monospace;color:var(--fraco);
  letter-spacing:.14em;text-transform:uppercase}
.etf{font:400 12px 'IBM Plex Mono',monospace;color:var(--fraco)}
.topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rot{font:400 13px 'IBM Plex Sans';color:var(--fraco);display:block}
input,textarea,select,button{font-family:'IBM Plex Sans',sans-serif}
input,textarea,select{width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--linha);background:#fff;color:var(--tinta);font-size:15px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.suf{font:400 13px 'IBM Plex Mono',monospace;color:var(--fraco);flex-shrink:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.linha-in{display:flex;align-items:center;gap:6px;margin-top:6px}
/* abas */
nav.abas{display:flex;gap:4;align-items:center;border-bottom:1px solid var(--linha);
  margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{background:none;border:none;border-bottom:2px solid transparent;
  padding:8px 12px;cursor:pointer;color:var(--fraco);font:500 13px 'IBM Plex Sans';white-space:nowrap}
nav.abas button.on{color:var(--tinta);border-bottom-color:var(--teal)}
#estado{margin-left:auto;font:400 11px 'IBM Plex Mono',monospace;color:var(--fraco);
  letter-spacing:.06em;padding-bottom:8px;white-space:nowrap}
/* instrumento */
.num{font:600 44px/1 'IBM Plex Mono',monospace;letter-spacing:-.02em}
.trilho{position:relative;height:34px;border-radius:6px;overflow:hidden;background:#EEF1F3}
.zona{position:absolute;top:0;bottom:0}
.marca{position:absolute;top:0;bottom:0;width:2px}
.agulha{position:absolute;top:-3px;bottom:-3px;width:4px;border-radius:2px;
  box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.legs{position:relative;height:18px;margin-top:6px}
.legs span{position:absolute;transform:translateX(-50%);white-space:nowrap;
  font:400 10px 'IBM Plex Mono',monospace}
.prot{height:8px;border-radius:4px;background:#EEF1F3;overflow:hidden;margin-top:10px}
.prot>div{height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.alerta{background:var(--barroclaro);border:1px solid #E4C6C0;border-radius:12px;
  padding:14px 18px;margin-bottom:14px;font:400 13px/1.5 'IBM Plex Sans';color:var(--barro)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--linha);cursor:pointer;
  font:500 13px 'IBM Plex Sans';background:transparent;color:var(--tinta);transition:all .15s}
.divisor{margin-top:18px;padding-top:16px;border-top:1px solid var(--linha)}
.resumo-dia{margin-top:16px;padding:10px 14px;border-radius:8px;background:var(--tealclaro);
  font:500 13px 'IBM Plex Sans';color:var(--teal)}
/* checklist */
ul.lst{list-style:none;padding:0;margin:12px 0 0}
ul.lst button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:none;padding:7px 0;cursor:pointer}
.cx{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--linha);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.selo{margin-left:auto;font:500 10px 'IBM Plex Mono',monospace;color:var(--barro);
  letter-spacing:.08em;text-transform:uppercase}
/* resumo / cards */
.rcard{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:16px}
.rval{font:600 26px/1.1 'IBM Plex Mono',monospace;margin:8px 0 4px}
.nota{font:400 12px 'IBM Plex Sans';color:var(--fraco);margin:6px 0 0}
/* treino */
.serie{background:#F5F7F8;border:1px solid var(--linha);border-radius:8px;padding:10px}
.gser{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.snum{font:500 10px 'IBM Plex Mono',monospace;color:var(--fraco);letter-spacing:.1em;
  display:block;margin-bottom:7px}
.ultc{font:500 12px 'IBM Plex Mono',monospace;color:var(--teal);background:var(--tealclaro);
  border-radius:5px;padding:3px 9px;white-space:nowrap}
.dropsel{background:#F2E6CF;color:var(--areia);border-radius:4px;padding:2px 7px;
  font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
/* botões */
.btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px 20px;
  cursor:pointer;font:500 14px 'IBM Plex Sans'}
.btn2{background:transparent;color:var(--fraco);border:1px solid var(--linha);border-radius:8px;
  padding:11px 20px;cursor:pointer;font:500 14px 'IBM Plex Sans'}
.btnlink{background:none;border:none;color:var(--fraco);cursor:pointer;
  font:400 12px 'IBM Plex Sans';text-decoration:underline;padding:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:#EEF1F3;border-radius:5px;padding:3px 9px;
  font:400 11px 'IBM Plex Mono',monospace;color:var(--fraco)}
.pont{font:600 20px 'IBM Plex Mono',monospace;color:var(--barro);line-height:1}
.gatilho{font:400 13px/1.5 'IBM Plex Sans';padding-left:14px;
  border-left:2px solid var(--linha);margin-bottom:10px}
.vazio{font:400 13px/1.6 'IBM Plex Sans';color:var(--fraco);text-align:center;
  padding:28px 20px;background:var(--papel);border-radius:12px;border:1px dashed var(--linha)}
footer{max-width:880px;margin:28px auto 0;font:400 11px/1.6 'IBM Plex Sans';
  color:var(--fraco);text-align:center}
/* login */
.login{max-width:380px;margin:8vh auto;background:var(--papel);border:1px solid var(--linha);
  border-radius:12px;padding:28px}
.login input{margin-top:6px;margin-bottom:14px}
.erro{color:var(--barro);font:400 13px 'IBM Plex Sans';margin-top:10px}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
svg text{font:400 10px 'IBM Plex Mono',monospace;fill:var(--fraco)}
.metalinha{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--linha)}
.metalinha input{width:88px;text-align:right}
.dia{border:none;padding:0;cursor:pointer;aspect-ratio:1;border-radius:6px;
  display:flex;align-items:center;justify-content:center}
.dia:hover{transform:scale(1.14)}
.dia:focus-visible{outline:2px solid #fff;outline-offset:2px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.legenda span{display:flex;align-items:center;gap:6px;font:400 11px 'IBM Plex Sans';color:#8FA0AE}
.pt{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0}
#detalheDia{margin-top:14px;padding:12px 14px;border-radius:8px;background:#20303E;
  font:400 13px/1.5 'IBM Plex Sans';color:#C6D2DB}
.faixaRef{position:relative;height:24px;border-radius:5px;background:#EEF1F3;
  overflow:hidden;margin-top:6px}
.faixaRef .ok{position:absolute;top:0;bottom:0;background:var(--tealclaro)}
.faixaRef .mk{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px}
.tile{border:1px solid var(--linha);border-radius:10px;padding:14px}
.gradeDois{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
svg text{font-family:'IBM Plex Mono',monospace}
@media (prefers-reduced-motion:no-preference){
  .anim{transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
  .dia{transition:transform .12s}
}

/* ---------- relatório ---------- */
.relCabecalho{border-bottom:2px solid var(--tinta);padding-bottom:12px;margin-bottom:20px}
.relCabecalho h2{font:700 22px/1.2 'IBM Plex Sans Condensed';margin:0 0 6px}
.relCabecalho p{font:400 13px/1.5 'IBM Plex Sans';color:var(--fraco);margin:0}
.relAviso{font-size:11px!important;font-style:italic;margin-top:8px!important}
.relSec{margin-bottom:26px;break-inside:avoid}
.relSec h3{font:600 15px 'IBM Plex Sans';margin:0 0 10px;padding-bottom:5px;
  border-bottom:1px solid var(--linha)}
.relSec h4{font:600 13px 'IBM Plex Sans';margin:18px 0 8px;color:var(--fraco)}
.relTexto{font:400 13px/1.6 'IBM Plex Sans';white-space:pre-wrap;margin:0}
.relTab{width:100%;border-collapse:collapse;font:400 13px 'IBM Plex Sans'}
.relTab th{text-align:left;font-weight:400;color:var(--fraco);padding:6px 8px 6px 0;
  vertical-align:top}
.relTab td{padding:6px 8px 6px 0;font-family:'IBM Plex Mono',monospace;font-size:12px}
.relTab tbody tr{border-bottom:1px solid var(--linha)}
.relLista thead th{font:600 10px 'IBM Plex Mono';text-transform:uppercase;
  letter-spacing:.06em;border-bottom:1.5px solid var(--tinta);padding-bottom:5px}
.relLista td{font-size:11px;padding:5px 8px 5px 0}
.relLista td:last-child{font-family:'IBM Plex Sans',sans-serif;font-size:11px}
.relGrafico{margin:14px 0}
.relLegenda{font:400 11px/1.5 'IBM Plex Sans';color:var(--fraco);margin:6px 0 0}
.relComent{font:400 12px/1.6 'IBM Plex Sans';color:var(--tinta);margin:10px 0 0;
  padding:9px 12px 9px 30px;border-radius:5px;position:relative;
  background:#F1F4F6;border:1px solid var(--linha)}
.relComent .relSinal{position:absolute;left:11px;top:12px;width:9px;height:9px;
  border-radius:50%;background:var(--fraco)}
.relComent.bom{background:#E7F1EE;border-color:#B9D6CF}
.relComent.bom .relSinal{background:#1F6F68}
.relComent.atencao{background:#F8F0DC;border-color:#E3D2A6}
.relComent.atencao .relSinal{background:#B98B2E}
.relComent.ruim{background:#F8E8E5;border-color:#E4C6C0}
.relComent.ruim .relSinal{background:#A2453A}
.relLegendaSemaforo{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.relLegendaSemaforo span{display:flex;align-items:center;gap:6px;
  font:400 11px 'IBM Plex Sans';color:var(--fraco)}
.relLegendaSemaforo i{width:9px;height:9px;border-radius:50%;display:inline-block}
.relAnotacao{border-bottom:1px solid var(--linha);height:34px}
#relatorio{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:24px}

@media print{
  @page{margin:14mm}
  .relComent{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .relLegendaSemaforo i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;padding:0;font-size:11pt}
  .naoImprimir,nav.abas,header,footer,#msgerro{display:none!important}
  #relatorio{border:none;border-radius:0;padding:0;background:#fff}
  .relSec{page-break-inside:avoid}
  .relTab td,.relTab th{color:#000}
  svg{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://bxmavxwulyzayzwrlgwm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9LbETG1jHtvye6Tg_m4_tw_dNHX-LCy';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= CONSTANTES ================= */
/* paleta em JS, espelhando as variáveis CSS — usada pelos gráficos SVG */
const C = {
  fundo:'#E7EBEE', papel:'#FCFDFD', tinta:'#16202B', fraco:'#6C7A88',
  linha:'#D3DAE0', teal:'#1F6F68', tealClaro:'#D4E5E3', areia:'#B98B2E',
  barro:'#A2453A', barroClaro:'#F6E7E4', azul:'#4C7BA6', trigo:'#E4B96B',
};

const SESSOES = [
  ['forcaA','Força A','#1F6F68'], ['zona2','Zona 2','#4C7BA6'],
  ['forcaB','Força B','#1F6F68'], ['forcaC','Força C','#1F6F68'],
  ['caminhada','Caminhada','#7C8B99'], ['corrida','Corrida','#4C7BA6'],
  ['descanso','Descanso','#B6BEC6'],
];
const GRUPOS = [
  ['superiores','Superiores','#1F6F68'], ['core','Core','#8A6A2F'],
  ['inferiores','Inferiores','#4C7BA6'], ['alongamento','Alongamento','#7C8B99'],
];
const CHECKS = [
  ['comeuAntes','Comi antes do remédio',1],
  ['sem5h','Nenhum intervalo > 5h sem comer',1],
  ['cafeina14','Cafeína encerrada até 14h',0],
  ['respManha','Respiração 5 min — manhã',0],
  ['respNoite','Respiração 5 min — noite',0],
  ['cama','Na cama até 22:30',0],
];
const EXERCICIOS = {
  forcaA:{nome:'Força A — corpo inteiro',lista:[
    ['a1','Agachamento ou leg press','8–12',0,0],
    ['a2','Supino ou flexão','8–12',0,0],
    ['a3','Remada','8–12',0,0],
    ['a4','Elevação lateral','10–12',0,0],
    ['a5','Prancha','30–45 s',1,1]]},
  forcaB:{nome:'Força B — corpo inteiro',lista:[
    ['b1','Levantamento terra romeno','8–12',0,0],
    ['b2','Desenvolvimento','8–12',0,0],
    ['b3','Puxada','8–12',0,0],
    ['b4','Afundo','10 por perna',0,0],
    ['b5','Abdominal','12–15',1,1]]},
  forcaC:{nome:'Força C — opcional, recomposição',lista:[
    ['c1','Leg press ou cadeira extensora','10–12',0,0],
    ['c2','Supino inclinado','8–12',0,0],
    ['c3','Remada unilateral','10 por lado',0,0],
    ['c4','Rosca direta','10–12',0,0],
    ['c5','Tríceps corda','10–12',0,1]]},
};
const CARDIO = {
  zona2:['Zona 2 — 35 a 45 min',[
    'Faixa alvo: 120 a 135 bpm.',
    'Teste da fala: frases completas sim, cantar não.',
    'Passou de 140, diminua o ritmo. Caminhe se precisar.',
    'Aquecimento de 5 a 10 min e desaquecimento de 5 min, sempre.']],
  corrida:['Corrida — 5 a 6 km confortável',[
    'Ritmo em que você ainda consegue conversar.',
    'Nunca em jejum. Carbo mais proteína 60 a 90 min antes.',
    'Nunca parar de repente: 5 min caminhando ao final.',
    'Se a sensação de crise começar, reduza para caminhada — não pare.']],
  caminhada:['Caminhada longa e mobilidade — 40 a 50 min',[
    'Intensidade muito baixa. Esta sessão é recuperação.',
    '10 min de mobilidade ao final: quadril, torácica, tornozelo.']],
  descanso:['Descanso',['Descanso também é parte do plano. Não compense treinando.']],
};
const AGENDA = ['descanso','forcaA','zona2','forcaB','caminhada','corrida','caminhada'];
const METAS_PADRAO = {piso_kcal:1900,kcal_alvo:2150,gasto_kcal:2697,proteina_g:183,
  agua_l:2.75,cafeina_max_ml:450,peso_base:90.8,fc_base:57,sono_alvo_min:435, limite_tela:'21:00',
  medicacoes:'', inicio_plano:'2026-08-26'};

/* ================= UTIL ================= */
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hojeIso = () => iso(new Date());
const somaDias = (s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diaPlano = (s,ini)=>Math.floor((new Date(s+'T00:00:00')-new Date(ini+'T00:00:00'))/864e5)+1;
const DIAS_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function rotuloData(s){const d=new Date(s+'T00:00:00');
  return `${DIAS_SEM[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
const hm = m => m ? `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}` : '—';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = id => document.getElementById(id);

/* ================= ESTADO ================= */
const S = {
  user:null, aba:'painel', data:hojeIso(),
  registros:{},         // data -> registro
  cargas:{},            // data -> {exId: {serie: {carga_kg,reps}}}
  cargasMax:{},         // exId -> maior carga anterior
  crises:[], itens:[], itemEdicao:null, metas:{...METAS_PADRAO},
  vendo:null, salvando:false, msg:'',
};

/* ================= PERSISTÊNCIA ================= */
let fila = {}, timer = null;

function marcar(tipo, dados){
  fila[tipo] = {...(fila[tipo]||{}), ...dados};
  S.salvando = true; pintarEstado();
  clearTimeout(timer);
  timer = setTimeout(descarregar, 700);
}

async function descarregar(){
  const f = fila; fila = {};
  const chaves = Object.keys(f);
  if(!chaves.length){ S.salvando=false; pintarEstado(); return; }
  try{
    if(f.registro){
      const r = {...S.registros[S.data], data:S.data, ...f.registro};
      delete r.id; delete r.user_id; delete r.criado_em; delete r.atualizado_em;
      const {error} = await sb.from('sd_registros_diarios')
        .upsert(r,{onConflict:'user_id,data'});
      if(error) throw error;
    }
    if(f.metas){
      const {error} = await sb.from('sd_metas')
        .upsert({...S.metas, user_id:S.user.id},{onConflict:'user_id'});
      if(error) throw error;
    }
    if(f.cargas){
      const linhas = Object.values(f.cargas);
      if(linhas.length){
        const {error} = await sb.from('sd_cargas_treino')
          .upsert(linhas,{onConflict:'user_id,data,exercicio_id,serie'});
        if(error) throw error;
      }
    }
    S.msg=''; S.salvando=false;
  }catch(e){
    fila = {...f, ...fila};
    S.msg = 'Falha ao salvar: ' + (e.message||e);
    S.salvando=false;
  }
  pintarEstado();
}
addEventListener('pagehide', ()=>{clearTimeout(timer); descarregar()});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){clearTimeout(timer); descarregar()}
});


/* ================= CARGA INICIAL ================= */
async function carregarTudo(){
  const ini = S.metas.inicio_plano;
  const fim = somaDias(ini, 40);
  const [rd, ct, cr, mt, it] = await Promise.all([
    sb.from('sd_registros_diarios').select('*').gte('data',ini).lte('data',fim),
    sb.from('sd_cargas_treino').select('*'),
    sb.from('sd_crises').select('*').order('data',{ascending:false}),
    sb.from('sd_metas').select('*').maybeSingle(),
    sb.from('sd_itens_uso').select('*').order('ordem'),
  ]);
  if(mt.data) S.metas = {...METAS_PADRAO, ...mt.data};
  else await sb.from('sd_metas').upsert({user_id:S.user.id, ...METAS_PADRAO});

  S.registros = {};
  (rd.data||[]).forEach(r => S.registros[r.data] = r);

  S.cargas = {}; S.cargasMax = {};
  (ct.data||[]).forEach(c=>{
    (S.cargas[c.data] ||= {});
    (S.cargas[c.data][c.exercicio_id] ||= {});
    S.cargas[c.data][c.exercicio_id][c.serie] = c;
  });
  S.crises = cr.data||[];
  S.itens = it.data||[];
  recalcularMax();
}

function recalcularMax(){
  S.cargasMax = {};
  Object.entries(S.cargas).forEach(([data,exs])=>{
    if(data >= S.data) return;
    Object.entries(exs).forEach(([ex,series])=>{
      Object.values(series).forEach(s=>{
        if(s.carga_kg!=null && (!S.cargasMax[ex] || s.carga_kg > S.cargasMax[ex]))
          S.cargasMax[ex] = Number(s.carga_kg);
      });
    });
  });
}

/* ================= HELPERS DE REGISTRO ================= */
function reg(){ return S.registros[S.data] || {data:S.data, sessoes:[], grupos:[], checklist:{}} }
function setCampo(campo, valor){
  const r = reg();
  const v = valor === '' ? null : valor;
  S.registros[S.data] = {...r, [campo]:v};
  marcar('registro', {[campo]:v});
}
function alternarLista(campo, valor){
  const r = reg(); const atual = r[campo]||[];
  const nova = atual.includes(valor) ? atual.filter(x=>x!==valor) : [...atual, valor];
  S.registros[S.data] = {...r, [campo]:nova};
  marcar('registro', {[campo]:nova});
  render();
}
function alternarCheck(id){
  const r = reg(); const c = {...(r.checklist||{})}; c[id] = !c[id];
  S.registros[S.data] = {...r, checklist:c};
  marcar('registro', {checklist:c});
  render();
}

/* --- gráficos em SVG --- */
function svgDonut(p,cor,{r=48,w=12,txt,sub,size=124}={}){
  const c=2*Math.PI*r, cx=size/2;
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EEF1F3" stroke-width="${w}"/>
    <circle class="anim" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${cor}" stroke-width="${w}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(p,100)/100)}"
      transform="rotate(-90 ${cx} ${cx})"/>
    <text x="${cx}" y="${cx+2}" text-anchor="middle" style="font-size:23px;font-weight:600;fill:${C.tinta}">${txt??p+'%'}</text>
    ${sub?`<text x="${cx}" y="${cx+18}" text-anchor="middle" style="font-size:9px;fill:${C.fraco};letter-spacing:.1em">${sub}</text>`:''}
  </svg>`;
}
function svgPizza(segs,size=150){
  const tot=segs.reduce((s,x)=>s+x[1],0);
  if(!tot) return '';
  const r=size/2-3, cx=size/2;
  /* fatia única de 100%: arco degenera (início = fim), desenha círculo */
  const cheia = segs.find(x=>x[1]===tot);
  if(cheia) return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="${cheia[2]}"/>
    <text x="${cx}" y="${cx+5}" text-anchor="middle"
      style="font-size:15px;font-weight:600;fill:#fff">100%</text></svg>`;
  let a=-Math.PI/2, o='';
  segs.forEach(([,v,cor])=>{
    if(!v) return;
    const a2=a+2*Math.PI*v/tot;
    const p1=[cx+r*Math.cos(a),cx+r*Math.sin(a)], p2=[cx+r*Math.cos(a2),cx+r*Math.sin(a2)];
    o+=`<path d="M${cx} ${cx} L${p1} A${r} ${r} 0 ${a2-a>Math.PI?1:0} 1 ${p2} Z"
      fill="${cor}" stroke="${C.papel}" stroke-width="2"/>`;
    const am=(a+a2)/2;
    if(v/tot>0.08) o+=`<text x="${cx+r*0.6*Math.cos(am)}" y="${cx+r*0.6*Math.sin(am)+4}"
      text-anchor="middle" style="font-size:13px;font-weight:600;fill:#fff">${Math.round(v/tot*100)}%</text>`;
    a=a2;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">${o}</svg>`;
}
function svgRadar(vals,size=220){
  const cx=size/2, r=size/2-36, n=vals.length;
  const pt=(i,f)=>{const a=-Math.PI/2+2*Math.PI*i/n; return [cx+r*f*Math.cos(a), cx+r*f*Math.sin(a)]};
  let g=''; [0.25,0.5,0.75,1].forEach(f=>
    g+=`<polygon points="${vals.map((_,i)=>pt(i,f)).join(' ')}" fill="none" stroke="${C.linha}"/>`);
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px">${g}
    <polygon points="${vals.map((v,i)=>pt(i,Math.min(v[1],100)/100)).join(' ')}"
      fill="rgba(31,111,104,.18)" stroke="${C.teal}" stroke-width="2"/>
    ${vals.map((v,i)=>{const q=pt(i,Math.min(v[1],100)/100);
      return `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${C.teal}"/>`}).join('')}
    ${vals.map((v,i)=>{const q=pt(i,1.24);
      return `<text x="${q[0]}" y="${q[1]+3}" text-anchor="middle"
        style="font-size:9px;fill:${C.fraco};letter-spacing:.05em">${v[0].toUpperCase()}</text>`}).join('')}</svg>`;
}
function svgSpark(v,cor,w=200,h=40){
  if(v.length<2) return `<p class="etf" style="margin:8px 0 0">dados insuficientes</p>`;
  const mn=Math.min(...v), mx=Math.max(...v);
  const x=i=>i/(v.length-1)*w, y=n=>h-2-(n-mn)/((mx-mn)||1)*(h-6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px">
    <polyline points="${v.map((n,i)=>`${x(i)},${y(n)}`).join(' ')}" fill="none"
      stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line x1="${x(v.length-1)}" y1="${y(v.at(-1))-4}" x2="${x(v.length-1)}" y2="${y(v.at(-1))+4}"
      stroke="${cor}" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

  const eixo=[1,7,14,21,28].map(d=>
    `<text x="${x(d)}" y="${H-8}" text-anchor="middle" style="font-size:10px;fill:${C.fraco}">${d}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:190px">
    <rect x="${P.l}" y="${y(10)}" width="${W-P.l-P.r}" height="${y(7)-y(10)}"
      fill="#A2453A" fill-opacity=".05"/>
    ${guias}${pts}${eixo}
    <text x="${W/2}" y="${H-8}" text-anchor="middle"
      style="font-size:9px;fill:${C.fraco};letter-spacing:.1em">DIA DO PLANO</text></svg>`;
}

function viewPainel(){
  const M=S.metas, s=serie();
  const hj=hojeIso();
  const r=S.registros[hj] || {sessoes:[],grupos:[],checklist:{}};
  const datasCrise=new Set(S.crises.map(c=>c.data));

  /* ---- grade dos 30 dias ---- */
  const corDia = d => {
    const reg=S.registros[d.data];
    if(!reg) return '#2B3B49';
    if(datasCrise.has(d.data)) return C.barro;
    if(reg.kcal!=null && reg.kcal<M.piso_kcal) return '#E4B96B';
    return d.treinou ? C.teal : C.tealClaro;
  };

  /* ---- leitura de hoje ---- */
  const linhas=[
    ['Calorias', r.kcal, 'kcal', M.piso_kcal, M.kcal_alvo+150, 1400, 3000],
    ['Proteína', r.proteina_g, 'g', Math.round(M.proteina_g*0.9), 220, 60, 240],
    ['Sono', r.sono_min, 'min', M.sono_alvo_min, 510, 300, 560],
    ['FC repouso', r.fc_repouso, 'bpm', 48, 60, 44, 75],
  ].filter(l=>l[1]!=null);

  /* ---- pendências ---- */
  const ck=r.checklist||{}, pend=[];
  const treinouHoje=(r.sessoes||[]).some(x=>x!=='descanso')||(r.grupos||[]).length>0;
  const kcalHoje=Number(r.kcal)||0, protHoje=Number(r.proteina_g)||0;
  if(kcalHoje>0 && kcalHoje<M.piso_kcal) pend.push([`Comer mais ${M.piso_kcal-kcalHoje} kcal para chegar ao piso`,1]);
  if(!ck.comeuAntes) pend.push(['Comer antes de tomar o Aymee',1]);
  if(!ck.sem5h) pend.push(['Confirmar que não passou 5h sem comer',1]);
  if(protHoje>0 && protHoje<M.proteina_g) pend.push([`Faltam ${M.proteina_g-protHoje} g de proteína`,0]);
  if(!ck.cafeina14) pend.push(['Encerrar a cafeína até as 14h',0]);
  if(!treinouHoje) pend.push(['Sessão do dia: '+(SESSOES.find(x=>x[0]===AGENDA[new Date(hj+'T00:00:00').getDay()])?.[1]||'—'),0]);
  if(!ck.cama) pend.push(['Na cama até 22:30',0]);
  if(r.ultima_tela && r.ultima_tela>M.limite_tela)
    pend.push([`Celular usado até ${r.ultima_tela.slice(0,5)} — limite ${M.limite_tela.slice(0,5)}`,0]);
  if(!r.ultima_tela) pend.push([`Registrar a última vez no celular (limite ${M.limite_tela.slice(0,5)})`,0]);

  /* ---- agregados ---- */
  const regs=s.filter(d=>S.registros[d.data]).map(d=>({...d,reg:S.registros[d.data]}));
  const n=regs.length;
  const comKcal=regs.filter(d=>d.kcal!=null);
  const acimaPiso=comKcal.filter(d=>d.kcal>=M.piso_kcal).length;
  const diasCrise=regs.filter(d=>datasCrise.has(d.data)).length;
  const comC=regs.filter(d=>datasCrise.has(d.data));
  const semC=regs.filter(d=>!datasCrise.has(d.data));
  const treinos=regs.filter(d=>d.treinou).length;

  const dim=[
    ['energia', pctd(media(regs.map(d=>d.kcal))||0, M.kcal_alvo)],
    ['proteína', pctd(media(regs.map(d=>d.reg.proteina_g))||0, M.proteina_g)],
    ['sono', pctd(media(regs.map(d=>d.sono))||0, M.sono_alvo_min)],
    ['treino', pctd(treinos, n)],
    ['cafeína', pctd(regs.filter(d=>d.reg.checklist?.cafeina14).length, n)],
    ['telas', pctd(regs.filter(d=>d.reg.ultima_tela && d.reg.ultima_tela<=M.limite_tela).length, n)],
    ['estresse', (()=>{ const e=media(regs.map(d=>d.reg.estresse_geral));
        return e!=null ? Math.max(0, Math.round(100-e)) : pctd(n-diasCrise, n) })()],
  ];

  const comparar=[
    ['Sono', media(comC.map(d=>d.sono)), media(semC.map(d=>d.sono)), v=>v?hm(Math.round(v)):'—'],
    ['Cafeína', media(comC.map(d=>d.reg.cafeina_ml)), media(semC.map(d=>d.reg.cafeina_ml)), v=>v?Math.round(v)+' ml':'—'],
    ['Calorias', media(comC.map(d=>d.kcal)), media(semC.map(d=>d.kcal)), v=>v?Math.round(v)+'':'—'],
    ['Estresse (Garmin)', media(comC.map(d=>d.reg.estresse_geral)),
      media(semC.map(d=>d.reg.estresse_geral)), v=>v!=null?Math.round(v)+'':'—'],
    ['Minutos em estresse alto', media(comC.map(d=>d.reg.estresse_alto_min)),
      media(semC.map(d=>d.reg.estresse_alto_min)), v=>v!=null?Math.round(v)+' min':'—'],
    ['Largou o celular às', media(comC.map(d=>minTela(d.reg.ultima_tela))),
      media(semC.map(d=>minTela(d.reg.ultima_tela))), v=>v!=null?hm(Math.round(v)):'—'],
  ];

  const ultPeso=[...regs].reverse().find(d=>d.peso)?.peso;

  return `
  <section class="cartao" style="background:${C.tinta};border-color:${C.tinta}">
    <div class="topo"><span class="et" style="color:#8FA0AE">Os 30 dias</span>
      <span class="etf" style="color:#8FA0AE">${n} registrado${n===1?'':'s'} · ${S.crises.length} crise${S.crises.length===1?'':'s'}</span></div>
    <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px">
      ${s.map((d,i)=>`<button class="dia" data-dia="${d.data}" title="Dia ${i+1}"
        style="background:${corDia(d)};${d.data===hj?'box-shadow:0 0 0 2px #fff':''}">
        <span style="font:500 9px 'IBM Plex Mono';color:${S.registros[d.data]?'#fff':'#5A6B79'}">${i+1}</span>
      </button>`).join('')}
    </div>
    <div class="legenda">
      <span><i class="pt" style="background:${C.teal}"></i>completo</span>
      <span><i class="pt" style="background:${C.tealClaro}"></i>sem treino</span>
      <span><i class="pt" style="background:#E4B96B"></i>abaixo do piso</span>
      <span><i class="pt" style="background:${C.barro}"></i>com crise</span>
    </div>
    <div id="detalheDia">Toque em um dia para ver os números.</div>
  </section>

  ${linhas.length?`<section class="cartao">
    <div class="topo"><span class="et">Leitura de hoje</span><span class="etf">contra a faixa alvo</span></div>
    <div style="margin-top:16px">
    ${linhas.map(([rot,val,un,lo,hi,min,max])=>{
      const p=v=>Math.max(0,Math.min(100,(v-min)/(max-min)*100));
      const ok=val>=lo&&val<=hi;
      return `<div style="margin-bottom:16px">
        <div class="topo"><span style="font:400 13px 'IBM Plex Sans'">${rot}</span>
          <span style="font:600 14px 'IBM Plex Mono';color:${ok?'var(--teal)':'var(--barro)'}">
            ${un==='min'?hm(val):val}${un==='min'?'':' <span class="etf">'+un+'</span>'}${ok?'':' ⚠'}</span></div>
        <div class="faixaRef"><div class="ok" style="left:${p(lo)}%;width:${p(hi)-p(lo)}%"></div>
          <div class="mk" style="left:${p(val)}%;background:${ok?C.teal:C.barro}"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:3px">
          <span class="etf" style="font-size:10px">${min}</span>
          <span class="etf" style="font-size:10px">alvo ${un==='min'?hm(lo)+'–'+hm(hi):lo+'–'+hi}</span>
          <span class="etf" style="font-size:10px">${max}</span></div></div>`}).join('')}
    </div></section>`:''}

  <section class="cartao">
    <span class="et">Falta hoje</span>
    ${pend.length===0
      ? `<p style="font:400 14px 'IBM Plex Sans';color:var(--teal);margin:12px 0 0">Tudo cumprido. Dia fechado.</p>`
      : `<ul class="lst">${pend.map(([t,crit])=>`<li style="display:flex;gap:10px;align-items:baseline;padding:7px 0">
          <span style="color:${crit?'var(--barro)':'var(--fraco)'};font-size:18px;line-height:1">·</span>
          <span style="font:400 14px/1.4 'IBM Plex Sans'">${t}</span>
          ${crit?'<span class="selo">crítico</span>':''}</li>`).join('')}</ul>`}
  </section>

  ${S.crises.length?`<section class="cartao">
    <div class="topo"><span class="et">Crises</span>
      <span class="etf">${S.crises.length} em ${diasCrise} dia${diasCrise===1?'':'s'} · intensidade média ${
        (media(S.crises.map(c=>c.intensidade))||0).toFixed(1)}</span></div>
    <p class="nota">Cada ponto é uma crise. Altura é a intensidade, tamanho é a duração.</p>
    ${svgCrises(S.crises, M.inicio_plano, C.barro)}
    <div class="legenda" style="color:var(--fraco)">
      <span style="color:var(--fraco)"><i class="pt" style="background:#D9A566"></i>até 3</span>
      <span style="color:var(--fraco)"><i class="pt" style="background:#C4703C"></i>4 a 5</span>
      <span style="color:var(--fraco)"><i class="pt" style="background:#A2453A"></i>6 a 7</span>
      <span style="color:var(--fraco)"><i class="pt" style="background:#8E3227"></i>8 ou mais</span>
    </div>
  </section>`:''}

  ${n>0?`<section class="cartao" style="text-align:center">
    <span class="et">Acima do piso calórico</span>
    <div style="margin:12px auto 0">
      ${svgDonut(pctd(acimaPiso,comKcal.length),C.teal,{sub:'DIAS OK'})}</div>
    <p class="nota">${acimaPiso} de ${comKcal.length} dias com lançamento</p>
  </section>

  <section class="cartao">
    <div class="topo"><span class="et">Perfil de adesão</span><span class="etf">média de ${n} dia${n===1?'':'s'}</span></div>
    <div style="display:flex;gap:16px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <div style="flex:0 0 220px;margin:0 auto">${svgRadar(dim)}</div>
      <div style="flex:1;min-width:170px">
        ${dim.map(([rot,v])=>`<div style="display:flex;justify-content:space-between;
          padding:5px 0;border-bottom:1px solid var(--linha)">
          <span style="font:400 13px 'IBM Plex Sans'">${rot}</span>
          <span style="font:600 13px 'IBM Plex Mono';color:${v>=85?'var(--teal)':v>=70?'var(--areia)':'var(--barro)'}">${v}%</span>
        </div>`).join('')}
      </div>
    </div>
  </section>`:''}

  ${diasCrise>0?`<section class="cartao">
    <span class="et">Onde estão as crises</span>
    <p class="nota">Média nos dias com crise, comparada aos demais.
      ${diasCrise<4?'Amostra pequena — trate como pista.':''}</p>
    <div style="margin-top:16px">
    ${comparar.map(([rot,a,b,fmt])=>{
      if(a==null&&b==null) return '';
      const dif = (a!=null&&b!=null&&b) ? Math.abs(Math.round((a-b)/b*100)) : null;
      return `<div style="margin-bottom:14px">
        <div class="topo"><span style="font:400 13px 'IBM Plex Sans'">${rot}</span>
          ${dif!=null?`<span class="etf" style="color:var(--barro)">${dif}% de diferença</span>`:''}</div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <div style="flex:1;background:var(--barroclaro);border-radius:6px;padding:8px 10px">
            <span class="etf" style="color:var(--barro)">com crise</span>
            <p style="font:600 15px 'IBM Plex Mono';margin:2px 0 0;color:var(--barro)">${fmt(a)}</p></div>
          <div style="flex:1;background:var(--tealclaro);border-radius:6px;padding:8px 10px">
            <span class="etf" style="color:var(--teal)">sem crise</span>
            <p style="font:600 15px 'IBM Plex Mono';margin:2px 0 0;color:var(--teal)">${fmt(b)}</p></div>
        </div></div>`}).join('')}
    </div></section>`:''}

  ${n>1?`<section class="cartao">
    <span class="et">Tendências</span>
    <div class="gradeDois" style="margin-top:14px">
      ${[['Peso', regs.filter(d=>d.peso).map(d=>d.peso), C.teal,
          ultPeso?ultPeso+' kg':'—',
          ultPeso?`${(ultPeso-M.peso_base>0?'+':'')}${(ultPeso-M.peso_base).toFixed(1)} desde a base`:`base ${M.peso_base} kg`],
         ['Sono', regs.filter(d=>d.sono).map(d=>d.sono), C.azul,
          media(regs.map(d=>d.sono))?hm(Math.round(media(regs.map(d=>d.sono)))):'—', `média de ${n} dias`],
         ['FC repouso', regs.filter(d=>d.fc).map(d=>d.fc), C.barro,
          media(regs.map(d=>d.fc))?Math.round(media(regs.map(d=>d.fc)))+' bpm':'—', `base ${M.fc_base} bpm`],
         ['Calorias', comKcal.map(d=>d.kcal), C.areia,
          media(comKcal.map(d=>d.kcal))?Math.round(media(comKcal.map(d=>d.kcal)))+' kcal':'—', 'média diária'],
         ['Estresse', regs.filter(d=>d.reg.estresse_geral!=null).map(d=>d.reg.estresse_geral), '#C4703C',
          media(regs.map(d=>d.reg.estresse_geral))!=null
            ? Math.round(media(regs.map(d=>d.reg.estresse_geral)))+'' : '—',
          'a linha caindo é o sinal bom']]
        .map(([rot,v,cor,val,nota])=>`<div class="tile">
          <span class="et">${rot}</span>
          <p style="font:600 19px 'IBM Plex Mono';margin:6px 0 2px">${val}</p>
          <span class="etf" style="font-size:11px">${nota}</span>
          ${svgSpark(v,cor)}</div>`).join('')}
    </div></section>`:''}

  ${n===0?`<p class="vazio">Lance o primeiro dia na aba Hoje. A grade acima e os gráficos
    começam a se preencher a partir daí.</p>`:''}`;
}

/* ---------- FARMÁCIA ---------- */
const FREQ = {diario:'Todo dia', semanal:'Semanal', se_necessario:'Se necessário'};
const TIPOS = [['medicamento','Medicamento'],['suplemento','Suplemento']];

function itensAtivos(){
  return (S.itens||[]).filter(i=>i.ativo)
    .sort((a,b)=>(a.ordem-b.ordem)||a.nome.localeCompare(b.nome));
}

function viewFarmacia(){
  const itens=(S.itens||[]).sort((a,b)=>(a.ativo===b.ativo?0:a.ativo?-1:1)
    ||(a.ordem-b.ordem)||a.nome.localeCompare(b.nome));
  const ficha=(i)=>`
    <article class="cartao" style="border-left:3px solid ${
      i.ativo?(i.tipo==='suplemento'?C.azul:C.teal):C.linha};${i.ativo?'':'opacity:.55'}">
      <div class="topo">
        <div>
          <p style="font:500 15px 'IBM Plex Sans';margin:0 0 3px">${esc(i.nome)}</p>
          <span class="etf">${esc(i.dose||'—')} · ${FREQ[i.frequencia]}${
            i.horario?' · '+i.horario.slice(0,5):''}</span>
        </div>
        <span class="tag">${i.tipo==='suplemento'?'suplemento':'medicamento'}</span>
      </div>
      ${i.inicio||i.fim?`<p class="nota">
        ${i.inicio?'Início '+rotuloData(i.inicio):''}${i.fim?' · fim '+rotuloData(i.fim):''}</p>`:''}
      ${i.observacao?`<p class="nota">${esc(i.observacao)}</p>`:''}
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <button class="btnlink" data-editaritem="${i.id}">Editar</button>
        <button class="btnlink" data-alternaritem="${i.id}">${i.ativo?'Suspender':'Reativar'}</button>
        <button class="btnlink" data-excluiritem="${i.id}">Excluir</button>
      </div>
    </article>`;

  const f=S.itemEdicao;
  return `
  ${f?`<section class="cartao destaque">
    <span class="et">${f.id?'Editar item':'Novo item'}</span>
    <div style="margin-top:14px">
      <span class="rot">Nome</span>
      <input type="text" id="it_nome" value="${esc(f.nome||'')}"
        placeholder="Ex.: Vitamina D" style="margin-top:6px"></div>
    <div class="chips">
      ${TIPOS.map(([v,r])=>`<button class="chip" data-ittipo="${v}"
        style="background:${f.tipo===v?(v==='suplemento'?C.azul:C.teal):'transparent'};
        color:${f.tipo===v?'#fff':C.tinta};border-color:${f.tipo===v?(v==='suplemento'?C.azul:C.teal):C.linha}">
        ${r}</button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px">
      <div><span class="rot">Dose por vez</span>
        <input type="text" id="it_dose" value="${esc(f.dose||'')}"
          placeholder="40 mg" style="margin-top:6px"></div>
      <div><span class="rot">Horário</span>
        <input type="time" id="it_horario" value="${f.horario?f.horario.slice(0,5):''}"
          style="margin-top:6px"></div>
      <div><span class="rot">Início</span>
        <input type="date" id="it_inicio" value="${f.inicio||''}" style="margin-top:6px"></div>
    </div>
    <div style="margin-top:14px"><span class="rot">Frequência</span>
      <div class="chips">
        ${Object.entries(FREQ).map(([v,r])=>`<button class="chip" data-itfreq="${v}"
          style="background:${f.frequencia===v?C.tinta:'transparent'};
          color:${f.frequencia===v?'#fff':C.tinta};border-color:${f.frequencia===v?C.tinta:C.linha}">
          ${r}</button>`).join('')}
      </div></div>
    <div style="margin-top:14px"><span class="rot">Observação</span>
      <input type="text" id="it_obs" value="${esc(f.observacao||'')}"
        placeholder="Sempre após comer" style="margin-top:6px"></div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn" id="salvarItem">Salvar</button>
      <button class="btn2" id="cancelarItem">Cancelar</button>
    </div>
  </section>`
  :`<button class="btn" id="novoItem" style="width:100%;margin-bottom:14px">
      Adicionar medicamento ou suplemento</button>`}

  ${itens.length===0
    ? `<p class="vazio">Nada cadastrado ainda. Adicione o que você toma para
       aparecer na aba Hoje e no relatório.</p>`
    : itens.map(ficha).join('')}`;
}

/* ---------- bloco de tomadas na aba Hoje ---------- */
function blocoTomadas(r){
  const itens=itensAtivos();
  if(!itens.length) return '';
  const t=r.tomadas||{};
  const feitos=itens.filter(i=>t[i.id]?.ok).length;
  return `
  <section class="cartao">
    <div class="topo"><span class="et">Medicação e suplementos</span>
      <span class="etf" style="color:${feitos===itens.length?'var(--teal)':'var(--fraco)'}">
        ${feitos} de ${itens.length}</span></div>
    <ul class="lst">
      ${itens.map(i=>{
        const reg=t[i.id]||{};
        const on=!!reg.ok;
        const hora=reg.hora || (i.horario?i.horario.slice(0,5):'');
        return `<li style="padding:9px 0;border-bottom:1px solid var(--linha)">
          <div style="display:flex;align-items:center;gap:11px">
            <button data-tomada="${i.id}" style="background:none;border:none;padding:0;cursor:pointer">
              <span class="cx" style="background:${on?(i.tipo==='suplemento'?C.azul:C.teal):'transparent'};
                border-color:${on?(i.tipo==='suplemento'?C.azul:C.teal):C.linha}">${on?'✓':''}</span>
            </button>
            <div style="flex:1;min-width:0">
              <p style="font:400 14px 'IBM Plex Sans';margin:0;
                color:${on?'var(--fraco)':'var(--tinta)'}">${esc(i.nome)}</p>
              <span class="etf" style="font-size:11px">${esc(i.dose||'')}${
                i.frequencia!=='diario'?' · '+FREQ[i.frequencia]:''}</span>
            </div>
            <input type="time" data-horatomada="${i.id}" value="${hora}"
              style="width:104px;padding:6px 8px;font-size:13px">
          </div>
          ${i.observacao&&!on?`<p class="nota" style="margin:4px 0 0 31px">${esc(i.observacao)}</p>`:''}
        </li>`}).join('')}
    </ul>
  </section>`;
}


function lerFormItem(){
  const v=id=>el(id)?el(id).value:undefined;
  return {nome:v('it_nome'), dose:v('it_dose'), horario:v('it_horario')||null,
          inicio:v('it_inicio')||null, observacao:v('it_obs')};
}

async function salvarItem(){
  const f={...S.itemEdicao, ...lerFormItem()};
  if(!f.nome || !f.nome.trim()){ S.msg='Dê um nome ao item.'; pintarEstado(); return; }
  const linha={nome:f.nome.trim(), tipo:f.tipo||'medicamento', dose:f.dose||null,
    frequencia:f.frequencia||'diario', horario:f.horario||null, inicio:f.inicio||null,
    observacao:f.observacao||null, ordem:f.ordem??((S.itens||[]).length+1), ativo:f.ativo??true};
  try{
    if(f.id){
      const {data,error}=await sb.from('sd_itens_uso').update(linha).eq('id',f.id).select().single();
      if(error) throw error;
      S.itens=(S.itens||[]).map(x=>x.id===f.id?data:x);
    }else{
      const {data,error}=await sb.from('sd_itens_uso').insert(linha).select().single();
      if(error) throw error;
      S.itens=[...(S.itens||[]), data];
    }
    S.itemEdicao=null; S.msg='';
  }catch(e){ S.msg='Erro ao salvar: '+(e.message||e); }
  render();
}

async function alternarItem(id){
  const it=(S.itens||[]).find(x=>x.id===id); if(!it) return;
  try{
    const {data,error}=await sb.from('sd_itens_uso').update({ativo:!it.ativo,
      fim: it.ativo?hojeIso():null}).eq('id',id).select().single();
    if(error) throw error;
    S.itens=S.itens.map(x=>x.id===id?data:x);
  }catch(e){ S.msg='Erro: '+(e.message||e); }
  render();
}

async function excluirItem(id){
  try{
    const {error}=await sb.from('sd_itens_uso').delete().eq('id',id);
    if(error) throw error;
    S.itens=(S.itens||[]).filter(x=>x.id!==id);
  }catch(e){ S.msg='Erro: '+(e.message||e); }
  render();
}

/* ---------- EVOLUÇÃO ---------- */
function serie(){
  const out=[]; const ini=S.metas.inicio_plano;
  for(let i=0;i<30;i++){
    const d=somaDias(ini,i), r=S.registros[d];
    out.push({i:i+1,data:d,
      rot:d.slice(8,10)+'/'+d.slice(5,7),
      peso:r?.peso_kg??null, sono:r?.sono_min??null, fc:r?.fc_repouso??null,
      kcal:r?.kcal??null,
      treinou:(r?.sessoes?.some(s=>s!=='descanso')||r?.grupos?.length)?1:0});
  }
  return out;
}

function grafLinha(dados,chave,cor,dominio,ref,fmt){
  const W=680,H=210,P={t:14,r:14,b:28,l:44};
  const vals=dados.map(d=>d[chave]).filter(v=>v!=null).map(Number);
  if(!vals.length) return `<p class="vazio">Sem dados ainda.</p>`;
  let [min,max] = dominio || [Math.min(...vals), Math.max(...vals)];
  if(max-min < 1e-9){ min-=1; max+=1; }          // valor único: abre a escala
  else if(!dominio){ const f=(max-min)*0.12; min-=f; max+=f; }
  const x=i=>P.l+(W-P.l-P.r)*i/(dados.length-1);
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-min)/(max-min));

  /* segmentos separados quando há lacunas */
  let d='', abrindo=true;
  dados.forEach((p2,i)=>{
    if(p2[chave]==null){ abrindo=true; return; }
    d += (abrindo?'M':'L')+x(i).toFixed(1)+' '+y(Number(p2[chave])).toFixed(1)+' ';
    abrindo=false;
  });

  const ticks=[min,(min+max)/2,max];
  const rotulos=dados.map((p2,i)=>({p2,i})).filter(o=>o.i%5===0||o.i===dados.length-1);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="${C.linha}" stroke-dasharray="2 4"/>
      <text x="6" y="${(y(t)+3).toFixed(1)}" style="font-size:10px;fill:${C.fraco}">${fmt?fmt(t):Math.round(t)}</text>`).join('')}
    ${ref!=null&&ref>=min&&ref<=max?`<line x1="${P.l}" x2="${W-P.r}" y1="${y(ref).toFixed(1)}" y2="${y(ref).toFixed(1)}"
      stroke="${C.fraco}" stroke-dasharray="5 4" opacity=".7"/>`:''}
    ${vals.length>1?`<path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${dados.map((p2,i)=>p2[chave]!=null
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(Number(p2[chave])).toFixed(1)}" r="3.5" fill="${cor}"/>`:'').join('')}
    ${rotulos.map(o=>`<text x="${x(o.i).toFixed(1)}" y="${H-8}" text-anchor="middle"
      style="font-size:10px;fill:${C.fraco}">${o.p2.rot}</text>`).join('')}
  </svg>`;
}

function grafBarras(dados,chave,cor,max,refs){
  const W=680,H=210,P={t:14,r:14,b:28,l:44};
  const n=dados.length;
  const passo=(W-P.l-P.r)/n;
  const bw=Math.min(passo*0.62, 22);
  const x=i=>P.l+passo*i+(passo-bw)/2;
  const y=v=>P.t+(H-P.t-P.b)*(1-Math.min(v,max)/max);
  const rotulos=dados.map((p2,i)=>({p2,i})).filter(o=>n<=6||o.i%5===0||o.i===n-1);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${[0,max/2,max].map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="${C.linha}" stroke-dasharray="2 4"/>
      <text x="6" y="${(y(t)+3).toFixed(1)}" style="font-size:10px;fill:${C.fraco}">${Math.round(t)}</text>`).join('')}
    ${(refs||[]).map(([v,c,tracejado])=>v<=max?`<line x1="${P.l}" x2="${W-P.r}"
      y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${c}" stroke-width="1.5"
      ${tracejado?'stroke-dasharray="5 4"':''}/>`:'').join('')}
    ${dados.map((p2,i)=>{const v=Number(p2[chave]);
      if(!v) return '';
      return `<rect x="${x(i).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${(H-P.b-y(v)).toFixed(1)}" fill="${cor}" rx="2"/>`}).join('')}
    ${rotulos.map(o=>`<text x="${(x(o.i)+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle"
      style="font-size:10px;fill:${C.fraco}">${o.p2.rot||o.p2.semana||''}</text>`).join('')}
  </svg>`;
}

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">

}

function ligarEventos(){
  document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{S.aba=b.dataset.aba;render()});
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    S.data=somaDias(S.data,+b.dataset.nav); recalcularMax(); render()});
  const h=document.querySelector('[data-hoje]'); if(h) h.onclick=()=>{S.data=hojeIso();recalcularMax();render()};

  document.querySelectorAll('[data-campo]').forEach(i=>i.oninput=()=>{
    const v=i.type==='number'?(i.value===''?'':Number(i.value)):i.value;
    setCampo(i.dataset.campo, v);
    if(['kcal','proteina_g','kcal_gasto'].includes(i.dataset.campo)) atualizarInstrumento();
  });
  document.querySelectorAll('[data-lista]').forEach(b=>b.onclick=()=>alternarLista(b.dataset.lista,b.dataset.val));
  document.querySelectorAll('[data-relacao]').forEach(b=>b.onclick=()=>{
    const v = b.dataset.relacao==='sim';
    setCampo('houve_relacao', reg().houve_relacao===v ? null : v); render();
  });
  document.querySelectorAll('[data-ejac]').forEach(b=>b.onclick=()=>{
    setCampo('ejaculacao', reg().ejaculacao===b.dataset.ejac ? null : b.dataset.ejac); render();
  });
  document.querySelectorAll('[data-ansdur]').forEach(b=>b.onclick=()=>{
    setCampo('ansiedade_durante', !reg().ansiedade_durante); render();
  });
  const lb=el('libido');
  if(lb) lb.oninput=()=>{ setCampo('libido', Number(lb.value));
    lb.previousElementSibling.querySelector('span:last-child').textContent = lb.value+' / 10'; };
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>alternarCheck(b.dataset.check));
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{S.vendo=b.dataset.ver;render()});

  const sh=el('sonoH'), sm=el('sonoM');
  if(sh&&sm){ const upd=()=>{
    const t=(Number(sh.value)||0)*60+(Number(sm.value)||0);
    setCampo('sono_min', t||''); }; sh.oninput=upd; sm.oninput=upd; }

  document.querySelectorAll('[data-ex]').forEach(i=>i.oninput=()=>{
    const {ex,nome,serie:s,tipo}=i.dataset;
    (S.cargas[S.data]||={}); (S.cargas[S.data][ex]||={});
    const atual = S.cargas[S.data][ex][s] || {};
    const linha = {...atual, user_id:S.user.id, data:S.data, sessao:S.vendo,
      exercicio_id:ex, exercicio_nome:nome, serie:Number(s),
      [tipo]: i.value===''?null:Number(i.value)};
    S.cargas[S.data][ex][s]=linha;
    marcar('cargas', {[`${ex}-${s}`]:linha});
  });

  document.querySelectorAll('[data-metatexto]').forEach(i=>i.oninput=()=>{
    S.metas[i.dataset.metatexto]=i.value; marcar('metas',{});
  });
  document.querySelectorAll('[data-metatempo]').forEach(i=>i.oninput=()=>{
    S.metas[i.dataset.metatempo]=i.value; marcar('metas',{});
  });
  document.querySelectorAll('[data-meta]').forEach(i=>i.oninput=()=>{
    S.metas[i.dataset.meta] = i.type==='number'?Number(i.value):i.value;
    marcar('metas',{});
  });

  const ri=el('c_intensidade');
  if(ri) ri.oninput=()=>el('c_int_lbl').textContent=ri.value+' / 10';
  const sc=el('salvarCrise'); if(sc) sc.onclick=salvarCrise;
  document.querySelectorAll('[data-delcrise]').forEach(b=>b.onclick=async()=>{
    await sb.from('sd_crises').delete().eq('id',b.dataset.delcrise);
    S.crises=S.crises.filter(c=>c.id!==b.dataset.delcrise); render();
  });
  const det=el('detalheDia');
  if(det) document.querySelectorAll('.dia').forEach(b=>b.onclick=()=>{
    const d=b.dataset.dia, rg=S.registros[d];
    const nCr=S.crises.filter(c=>c.data===d).length;
    if(!rg){ det.innerHTML=`<span style="color:#8FA0AE">${rotuloData(d)} · sem lançamento.</span>`;
      return; }
    const partes=[];
    if(rg.kcal!=null) partes.push(rg.kcal+' kcal');
    if(rg.proteina_g!=null) partes.push(rg.proteina_g+' g proteína');
    if(rg.sono_min!=null) partes.push(hm(rg.sono_min)+' de sono');
    if(rg.fc_repouso!=null) partes.push('FC '+rg.fc_repouso);
    if(rg.peso_kg!=null) partes.push(rg.peso_kg+' kg');
    const ses=(rg.sessoes||[]).map(x=>SESSOES.find(y=>y[0]===x)?.[1]).filter(Boolean);
    if(ses.length) partes.push(ses.join(' + '));
    det.innerHTML=`<strong style="color:#fff">${rotuloData(d)}</strong>`
      + (partes.length?' · '+partes.join(' · '):' · sem números')
      + (nCr?` · <span style="color:#E4938A">${nCr} crise${nCr>1?'s':''}</span>`:'');
  });
  const bi=el('btnImprimir'); if(bi) bi.onclick=()=>window.print();
  /* ---- farmácia ---- */
  document.querySelectorAll('[data-tomada]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.tomada, rr=reg(), t={...(rr.tomadas||{})};
    const item=(S.itens||[]).find(x=>x.id===id);
    if(t[id]?.ok) delete t[id];
    else t[id]={ok:true, hora:(t[id]?.hora)||(item?.horario?item.horario.slice(0,5):null)};
    setCampo('tomadas', t); render();
  });
  document.querySelectorAll('[data-horatomada]').forEach(i=>i.oninput=()=>{
    const id=i.dataset.horatomada, rr=reg(), t={...(rr.tomadas||{})};
    t[id]={ok:t[id]?.ok??true, hora:i.value||null};
    setCampo('tomadas', t);
  });
  const ni=el('novoItem'); if(ni) ni.onclick=()=>{
    S.itemEdicao={tipo:'medicamento',frequencia:'diario',inicio:hojeIso()}; render(); };
  const ci=el('cancelarItem'); if(ci) ci.onclick=()=>{ S.itemEdicao=null; render(); };
  document.querySelectorAll('[data-ittipo]').forEach(b=>b.onclick=()=>{
    S.itemEdicao={...S.itemEdicao, ...lerFormItem(), tipo:b.dataset.ittipo}; render(); });
  document.querySelectorAll('[data-itfreq]').forEach(b=>b.onclick=()=>{
    S.itemEdicao={...S.itemEdicao, ...lerFormItem(), frequencia:b.dataset.itfreq}; render(); });
  document.querySelectorAll('[data-editaritem]').forEach(b=>b.onclick=()=>{
    S.itemEdicao={...(S.itens||[]).find(x=>x.id===b.dataset.editaritem)}; render(); });
  document.querySelectorAll('[data-alternaritem]').forEach(b=>b.onclick=()=>alternarItem(b.dataset.alternaritem));
  document.querySelectorAll('[data-excluiritem]').forEach(b=>b.onclick=()=>excluirItem(b.dataset.excluiritem));
  const si=el('salvarItem'); if(si) si.onclick=salvarItem;
  const s=el('sair'); if(s) s.onclick=async()=>{await sb.auth.signOut(); location.reload()};
}

function atualizarInstrumento(){
  // redesenha só o cartão de energia para não perder o foco do input
  const alvo = document.querySelector('.cartao.destaque');
  if(S.aba!=='hoje'||!alvo) return;
  const tmp=document.createElement('div'); tmp.innerHTML=viewHoje();
  const novo=tmp.querySelector('.cartao.destaque');
  const foco=document.activeElement?.dataset?.campo;
  if(foco){ // preserva o input em edição
    novo.querySelectorAll('[data-campo]').forEach(i=>{
      if(i.dataset.campo===foco) i.value=document.activeElement.value;
    });
  }
  alvo.querySelector('.num').textContent = novo.querySelector('.num').textContent;
  const t1=alvo.querySelector('.trilho'), t2=novo.querySelector('.trilho');
  if(t1&&t2) t1.innerHTML=t2.innerHTML;
  const p1=alvo.querySelector('.prot>div'), p2=novo.querySelector('.prot>div');
  if(p1&&p2) p1.style.width=p2.style.width;
  const l1=alvo.querySelector('.legs'), l2=novo.querySelector('.legs');
  if(l1&&l2) l1.innerHTML=l2.innerHTML;
}

async function salvarCrise(){
  const g=id=>el(id).value;
  const linha={
    data:g('c_data')||S.data,
    hora:g('c_hora')||null,
    duracao_min:g('c_duracao')?Number(g('c_duracao')):null,
    intensidade:Number(g('c_intensidade')),
    contexto:g('c_contexto')||null,
    horas_ultima_refeicao:g('c_refeicao')?Number(g('c_refeicao')):null,
    sono_anterior_min:g('c_sono')?Number(g('c_sono')):null,
    cafeina_ml:g('c_cafeina')?Number(g('c_cafeina')):null,
    treinou:g('c_treinou')||null,
    sintomas:g('c_sintomas')||null,
    o_que_ajudou:g('c_ajudou')||null,
  };
  const {data,error}=await sb.from('sd_crises').insert(linha).select().single();
  if(error){ S.msg='Erro ao salvar crise: '+error.message; pintarEstado(); return; }
  S.crises=[data,...S.crises]; render();
}

/* ================= LOGIN ================= */
function renderLogin(msg){
  el('app').innerHTML=`<div class="login">
    <p class="sobre">Painel de saúde</p>
    <h1 style="margin-bottom:20px">Entrar</h1>
    <span class="rot">E-mail</span><input type="email" id="email" autocomplete="username">
    <span class="rot">Senha</span><input type="password" id="senha" autocomplete="current-password">
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn" id="entrar">Entrar</button>
      <button class="btn2" id="criar">Criar conta</button>
    </div>
    <p class="erro">${msg?esc(msg):''}</p>
  </div>`;
  el('entrar').onclick=()=>auth('entrar');
  el('criar').onclick=()=>auth('criar');
  el('senha').onkeydown=e=>{if(e.key==='Enter')auth('entrar')};
}

async function auth(modo){
  const email=el('email').value.trim(), password=el('senha').value;
  if(!email||!password) return renderLogin('Preencha e-mail e senha.');
  const {data,error} = modo==='criar'
    ? await sb.auth.signUp({email,password})
    : await sb.auth.signInWithPassword({email,password});
  if(error) return renderLogin(error.message);
  if(!data.session) return renderLogin('Conta criada. Confirme o e-mail e depois entre.');
  iniciar(data.session.user);
}

async function iniciar(user){
  S.user=user;
  el('app').innerHTML='<p class="vazio">Carregando registros…</p>';
  try{ await carregarTudo(); }
  catch(e){ S.msg='Erro ao carregar: '+(e.message||e); }
  render();
}

/* ================= BOOT ================= */
const {data:{session}} = await sb.auth.getSession();
if(session) iniciar(session.user); else renderLogin();
</script>
